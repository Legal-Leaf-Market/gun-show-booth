<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><title>Booth Bandits baked goods label, Indiana home-based vendor (3 x 3 in)</title><rect x="0" y="0" width="300" height="300" fill="#FBFBF8"/><path d="M20 22h20v4a2 2 0 0 0 0 4v4H20v-4a2 2 0 0 0 0-4z" fill="#E8501A"/><text x="48" y="34" fill="#1F241E" font-family="Big Shoulders" font-weight="900" font-size="22" text-anchor="start">[PRODUCT NAME]</text><text x="20" y="58" fill="#1F241E" font-family="Barlow" font-weight="700" font-size="14.5" text-anchor="start">Ingredients:</text><text x="20" y="76" fill="#1F241E" font-family="Barlow" font-weight="400" font-size="14.5" text-anchor="start">[INGREDIENTS, heaviest first]</text><text x="20" y="94" fill="#1F241E" font-family="Barlow" font-weight="400" font-size="14.5" text-anchor="start">[continued]</text><text x="20" y="118" fill="#1F241E" font-family="Barlow" font-weight="600" font-size="14.5" text-anchor="start">Net wt [NET WT]   Made [DATE]</text><text x="20" y="136" fill="#1F241E" font-family="Barlow" font-weight="400" font-size="14.5" text-anchor="start">[PRODUCER NAME]</text><text x="20" y="154" fill="#1F241E" font-family="Barlow" font-weight="400" font-size="14.5" text-anchor="start">[PRODUCER ADDRESS]</text><rect x="14" y="170" width="272" height="104" rx="3" fill="#ECECE6" stroke="#1F241E" stroke-width="1"/><text x="20" y="189" fill="#1F241E" font-family="Barlow" font-weight="600" font-size="14.5" text-anchor="start">This product is home produced and</text><text x="20" y="207" fill="#1F241E" font-family="Barlow" font-weight="600" font-size="14.5" text-anchor="start">processed and the production area</text><text x="20" y="225" fill="#1F241E" font-family="Barlow" font-weight="600" font-size="14.5" text-anchor="start">has not been inspected by the Indiana</text><text x="20" y="243" fill="#1F241E" font-family="Barlow" font-weight="600" font-size="14.5" text-anchor="start">Department of Health. NOT FOR</text><text x="20" y="261" fill="#1F241E" font-family="Barlow" font-weight="600" font-size="14.5" text-anchor="start">RESALE.</text><g id="guides" opacity="0.65" fill="none"><rect x="12.5" y="12.5" width="275" height="275" stroke="#A8360B" stroke-dasharray="8 8"/><rect x="-12.5" y="-12.5" width="325" height="325" stroke="#4A5048" stroke-dasharray="4 8"/><rect x="0" y="0" width="300" height="300" stroke="#1F241E" stroke-width="1"/></g></svg>