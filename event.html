<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Event</title>
  <meta name="description" content="Dates, hours, admission and directions.">
  <meta name="theme-color" content="#4B5235">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Booth Bandits">
  <meta property="og:title" content="A show we're working: Booth Bandits">
  <meta property="og:description" content="Dates, hours, admission and directions.">
  <meta property="og:image" content="https://booth-bandits.netlify.app/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header id="top"></header>
  <main>
    <div class="wrap" id="page" style="padding-top:24px"><p class="empty">Loading the show details...</p></div>
  </main>
  <footer id="foot"></footer>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="assets/booth.js"></script>
  <script>
  (async () => {
    const B = Booth;
    const { site, events } = await B.load();
    B.chrome(site, "events");
    const page = document.getElementById("page");
    const id = new URLSearchParams(location.search).get("e");
    const ev = events.find((x) => x.id === id);
    if (!ev) {
      document.title = `Event not found: ${site.name}`;
      page.innerHTML = `<h1 style="font-size:2.6rem">That event isn't on the calendar</h1>
        <p class="lede" style="margin-top:10px">It may have ended or been taken down.</p>
        <p style="margin-top:18px"><a class="btn btn--go" href="events.html">See all events</a></p>`;
      return;
    }
    document.title = `${ev.title}: ${site.name}`;
    const today = B.today();
    const occs = B.occurrences(ev, today, B.addDays(today, 400));
    const live = occs.filter((o) => !o.cancelled);
    const next = live[0];
    const dir = B.directions(ev);
    const where = [ev.venue, ev.address].filter(Boolean);

    const datesList = occs.slice(0, 8).map((o) =>
      `<li class="${o.cancelled ? "cancel" : ""}">${B.esc(B.range(o.start, o.end))}${o.cancelled ? " <span class=\"sr-only\">(cancelled)</span>" : ""}</li>`).join("");

    page.innerHTML = `
      ${next
        ? B.ticket(next, site, { big: true, link: false, heading: "h1" })
        : `<h1 style="font-size:2.6rem">${B.esc(ev.title)}</h1><p class="empty">No upcoming dates for this one right now. <a href="events.html">See what else is coming up.</a></p>`}

      <div class="actions">
        ${where.length ? `<a class="btn btn--dark" href="${B.esc(dir.google)}" rel="noopener">Google Maps</a><a class="btn btn--dark" href="${B.esc(dir.apple)}" rel="noopener">Apple Maps</a>` : ""}
        ${live.length ? `<button class="btn" type="button" id="cal-add">Add to calendar</button>` : ""}
        <button class="btn" type="button" id="share">Share</button>
      </div>

      <section class="section" style="margin-top:32px" aria-labelledby="door-h">
        <h2 id="door-h">Getting in</h2>
        ${B.doorBox(site, ev)}
      </section>

      <div class="facts">
        ${occs.length ? `<div class="fact"><h3>${B.esc(B.repeatText(ev) && ev.repeat ? B.repeatText(ev) : "Dates")}</h3><ul class="dates">${datesList}</ul></div>` : ""}
        ${ev.hours ? `<div class="fact"><h3>Hours</h3><p>${B.esc(ev.hours)}</p></div>` : ""}
        ${where.length ? `<div class="fact"><h3>Where</h3><p>${where.map(B.esc).join("<br>")}</p></div>` : ""}
        ${ev.booth ? `<div class="fact"><h3>Finding our table</h3><p>${B.esc(ev.booth)}</p></div>` : ""}
        ${ev.notes ? `<div class="fact"><h3>Good to know</h3><p>${B.esc(ev.notes)}</p></div>` : ""}
        ${ev.link ? `<div class="fact"><h3>Show organizer</h3><p><a href="${B.esc(ev.link)}" rel="noopener">${B.esc(ev.link.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))}</a></p></div>` : ""}
      </div>

      <div class="map map--event" id="map" role="region" aria-label="Map"></div>
      <p style="margin-top:22px"><a href="events.html">All events</a></p>`;

    B.ld(B.eventLD(ev, occs, site));

    if (!B.map(document.getElementById("map"), [{ lat: ev.lat, lng: ev.lng, popup: `<b>${B.esc(ev.venue || ev.title)}</b>` }], { zoom: 15 }))
      document.getElementById("map").remove();

    const calBtn = document.getElementById("cal-add");
    if (calBtn) calBtn.addEventListener("click", () => {
      const blob = new Blob([B.ics(ev, live.slice(0, 12), site)], { type: "text/calendar" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = ev.id + ".ics";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
    document.getElementById("share").addEventListener("click", async () => {
      const data = { title: ev.title, text: next ? `${ev.title}, ${B.range(next.start, next.end)}` : ev.title, url: location.href };
      try {
        if (navigator.share) await navigator.share(data);
        else { await navigator.clipboard.writeText(location.href); B.toast("Link copied"); }
      } catch (_) { /* closed the share sheet */ }
    });
  })().catch((e) => { document.querySelector("main").insertAdjacentHTML("afterbegin", `<p class="wrap empty">The page didn't load: ${Booth.esc(e.message)}. Refresh to try again.</p>`); });
  </script>
</body>
</html>
