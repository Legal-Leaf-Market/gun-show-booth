# Plain static site: no build step, serve the repo root.
#
# Serving the root means every file in the repo is public unless a rule below
# says otherwise. A sister site learned that the hard way (its notes and
# planning docs were readable by anyone who guessed a name), so the files
# that exist for us rather than for customers answer 404. `force = true` is
# what makes a rule win over a file that really exists. test/run.mjs checks
# every repo-only file is covered.
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

# The Facebook originals of the CJ's Cakes photos are kept for the record;
# only the reviewed web copies beside them are served.
[[redirects]]
  from = "/assets/img/cjs-cakes/originals/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/brand/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/NAMES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sign.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/goods"
  to = "/goods.html"
  status = 301
  force = true

[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 301
  force = true

[[redirects]]
  from = "/cakes"
  to = "/cakes.html"
  status = 301
  force = true

[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 301
  force = true

[[redirects]]
  from = "/event"
  to = "/event.html"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
